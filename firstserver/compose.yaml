services:
  web:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped

  sensor:
    image: python:3.14-slim
    command: sh -c "pip install -q paho-mqtt==2.1.0 && python -u /sensor/sensor.py"
    init: true
    environment:
      SENSOR_WACHTWOORD: ${SENSOR_WACHTWOORD}
    volumes:
      - ./sensor:/sensor:ro
    depends_on:
      - mosquitto
    restart: unless-stopped

  nodered:
    image: nodered/node-red:5.0
    user: "1001:1001"
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - ./nodered:/data
    depends_on:
      - mosquitto
    restart: unless-stopped
